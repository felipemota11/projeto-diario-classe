<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Gerencie turmas, alunos, notas, recuperações, frequência e relatórios em um só lugar.">
  <meta name="theme-color" content="#5B4BFF">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Diário de Classe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Diário de Classe</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: light dark;
      --fundo: #F5F6FB;
      --texto: #1F2430;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0B0D12;
        --texto: #F3F4F8;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--fundo);
      font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #carregando {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--fundo);
      transition: opacity 220ms ease;
    }

    #carregando.oculto {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: linear-gradient(135deg, #5B4BFF, #8B5CF6);
      box-shadow: 0 18px 40px rgba(91, 75, 255, 0.28);
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .texto {
      color: var(--texto);
      font-size: 14px;
      font-weight: 600;
      opacity: 0.72;
      letter-spacing: 0.2px;
    }

    .barra {
      width: 132px;
      height: 4px;
      border-radius: 999px;
      background: rgba(91, 75, 255, 0.14);
      overflow: hidden;
    }

    .barra::after {
      content: "";
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #5B4BFF, #8B5CF6);
      animation: carregar 1.1s ease-in-out infinite;
    }

    @keyframes carregar {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(330%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .barra::after { animation: none; width: 100%; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="carregando" role="status" aria-label="Carregando o Diário de Classe">
    <div class="logo">DC</div>
    <div class="texto">Preparando seu diário...</div>
    <div class="barra"></div>
  </div>

  <script>
    // Remove a tela de carregamento assim que o Flutter desenha o primeiro frame.
    (function () {
      var carregando = document.getElementById('carregando');

      function esconderCarregamento() {
        if (!carregando) return;
        carregando.classList.add('oculto');
        window.setTimeout(function () {
          if (carregando && carregando.parentNode) {
            carregando.parentNode.removeChild(carregando);
          }
        }, 260);
      }

      window.addEventListener('flutter-first-frame', esconderCarregamento);

      // Rede de segurança para nunca deixar a tela de carregamento presa.
      window.setTimeout(esconderCarregamento, 10000);
    })();

    // Service worker permite instalar o app e abrir offline depois da primeira visita.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (erro) {
          console.warn('Service worker não registrado:', erro);
        });
      });
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
